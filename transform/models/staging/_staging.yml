version: 2

models:
  - name: stg_dim_product
    description: Productos tipados desde el CSV raw.
    columns:
      - name: sku
        tests: [not_null, unique]

  - name: stg_fct_shipment
    description: Envíos tipados; country normalizado (UK→GB).
    columns:
      - name: shipment_id
        tests: [not_null, unique]

  - name: stg_fct_sale_order_line
    description: Líneas de venta con surrogate key (D-10).
    columns:
      - name: sale_order_line_sk
        tests: [not_null, unique]
      - name: channel
        tests: [not_null]
      - name: sku
        tests: [not_null]
